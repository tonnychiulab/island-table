<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>島嶼餐桌 · 藍鵲播種</title>
  <style>
    :root {
      --bg-top: #c8e6c4;
      --bg-bottom: #8fbc8f;
      --frame: #2d4a3e;
      --magpie: #1e6bb8;
      --plant: #2e8b57;
      --bear: #2c2c2c;
      --pot: #c0392b;
      --ink: #1a1a1a;
      --panel: rgba(255, 255, 248, 0.92);
      --line: #1a3a5c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #1a2e24;
      color: var(--ink);
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage-wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      width: 1280px;
      height: 720px;
      position: relative;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #6b9e6b 100%);
      border: 4px solid var(--frame);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      transform-origin: center center;
      overflow: hidden;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 40% at 50% 100%, rgba(90, 140, 70, 0.45), transparent 70%),
        repeating-linear-gradient(
          -12deg,
          transparent,
          transparent 28px,
          rgba(255, 255, 255, 0.04) 28px,
          rgba(255, 255, 255, 0.04) 30px
        );
      pointer-events: none;
    }

    #fullscreen-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 5;
      font-size: 22px;
      font-weight: 700;
      padding: 10px 18px;
      border: 3px solid var(--frame);
      border-radius: 10px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
    }

    #fullscreen-btn:hover { filter: brightness(1.05); }
    #fullscreen-btn:focus-visible { outline: 3px solid var(--magpie); outline-offset: 2px; }

    h1 {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 36px;
      letter-spacing: 0.08em;
      color: #14352a;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
      pointer-events: none;
      z-index: 2;
    }

    #route-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #route-svg polyline {
      fill: none;
      stroke: var(--line);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 16 10;
    }

    .node {
      position: absolute;
      z-index: 3;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 5px solid rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 40px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .node:not(.start):hover { transform: scale(1.04); }
    .node.selected {
      box-shadow: 0 0 0 6px rgba(255, 255, 200, 0.95), 0 6px 16px rgba(0, 0, 0, 0.3);
    }
    .node.start {
      cursor: default;
      width: 160px;
      height: 160px;
      font-size: 42px;
      background: var(--magpie);
    }
    .node.plant { background: var(--plant); }
    .node.bear { background: var(--bear); color: #f0f0f0; }
    .node.pot { background: var(--pot); }

    #magpie { left: 90px; top: 280px; }
    #sansu { left: 420px; top: 160px; }
    #aiyu { left: 420px; top: 420px; }
    #bear { left: 780px; top: 200px; }
    #pot { left: 1000px; top: 380px; }

    .controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 28px;
      z-index: 4;
    }

    .controls button {
      font-family: inherit;
      font-size: 28px;
      font-weight: 800;
      padding: 14px 36px;
      border-radius: 14px;
      border: 4px solid var(--frame);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      min-width: 140px;
    }

    .controls button:hover { filter: brightness(1.05); }
    .controls button.primary {
      background: #ffe08a;
      border-color: #b8860b;
    }
    .controls button.hidden { display: none; }

    #message {
      position: absolute;
      left: 80px;
      right: 80px;
      bottom: 110px;
      min-height: 72px;
      padding: 18px 28px;
      background: var(--panel);
      border: 3px solid var(--frame);
      border-radius: 16px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
      z-index: 4;
      display: none;
    }

    #message.visible { display: block; }
    #message.fail { border-color: var(--pot); }
    #message.ok { border-color: var(--plant); }
    #message.hint { border-color: #b8860b; }
  </style>
</head>
<body>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <button type="button" id="fullscreen-btn" aria-label="全螢幕">全螢幕</button>
      <h1>藍鵲播種</h1>

      <svg id="route-svg" viewBox="0 0 1280 720" preserveAspectRatio="none" aria-hidden="true">
        <polyline id="route-line" points=""></polyline>
      </svg>

      <div class="node start" id="magpie" data-id="magpie" aria-label="藍鵲">藍鵲</div>
      <button type="button" class="node plant" id="sansu" data-id="sansu" aria-label="山蘇">山蘇</button>
      <button type="button" class="node plant" id="aiyu" data-id="aiyu" aria-label="愛玉">愛玉</button>
      <button type="button" class="node bear" id="bear" data-id="bear" aria-label="黑熊">黑熊</button>
      <button type="button" class="node pot" id="pot" data-id="pot" aria-label="鍋">鍋</button>

      <div id="message" role="status" aria-live="polite"></div>

      <div class="controls">
        <button type="button" id="btn-reset">重來</button>
        <button type="button" id="btn-go" class="primary">出發</button>
        <button type="button" id="btn-retry" class="hidden">再試一次</button>
        <button type="button" id="btn-again" class="hidden">再玩一次</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ORDER = ["sansu", "aiyu", "bear", "pot"];
      var LABELS = { sansu: "山蘇", aiyu: "愛玉", bear: "黑熊", pot: "鍋" };
      var FAIL_TEXT =
        "有人以前靠山林生活，打獵有自己的規矩。現在這些動物受保護，遊戲裡不能拿去煮。";
      var OK_TEXT =
        "山蘇可以炒來吃。愛玉果實可以做成愛玉冰。藍鵲是台灣特有的鳥。播種是遊戲。";

      var selected = [];
      var phase = "play"; // play | fail | success | hint

      var stage = document.getElementById("stage");
      var routeLine = document.getElementById("route-line");
      var messageEl = document.getElementById("message");
      var btnReset = document.getElementById("btn-reset");
      var btnGo = document.getElementById("btn-go");
      var btnRetry = document.getElementById("btn-retry");
      var btnAgain = document.getElementById("btn-again");
      var fullscreenBtn = document.getElementById("fullscreen-btn");

      var nodeEls = {
        magpie: document.getElementById("magpie"),
        sansu: document.getElementById("sansu"),
        aiyu: document.getElementById("aiyu"),
        bear: document.getElementById("bear"),
        pot: document.getElementById("pot")
      };

      function scaleStage() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var s = Math.min(w / 1280, h / 720);
        stage.style.transform = "scale(" + s + ")";
      }

      function centerOf(el) {
        return {
          x: el.offsetLeft + el.offsetWidth / 2,
          y: el.offsetTop + el.offsetHeight / 2
        };
      }

      function drawRoute() {
        var pts = [centerOf(nodeEls.magpie)];
        for (var i = 0; i < selected.length; i++) {
          pts.push(centerOf(nodeEls[selected[i]]));
        }
        var str = pts.map(function (p) { return p.x + "," + p.y; }).join(" ");
        routeLine.setAttribute("points", str);
      }

      function setMessage(text, kind) {
        if (!text) {
          messageEl.className = "";
          messageEl.textContent = "";
          messageEl.classList.remove("visible");
          return;
        }
        messageEl.textContent = text;
        messageEl.className = "visible " + (kind || "");
      }

      function syncButtons() {
        var playing = phase === "play" || phase === "hint";
        btnReset.classList.toggle("hidden", !playing);
        btnGo.classList.toggle("hidden", !playing);
        btnRetry.classList.toggle("hidden", phase !== "fail");
        btnAgain.classList.toggle("hidden", phase !== "success");
      }

      function clearRouteKeepMap() {
        selected = [];
        phase = "play";
        ORDER.forEach(function (id) {
          nodeEls[id].classList.remove("selected");
        });
        setMessage("");
        drawRoute();
        syncButtons();
      }

      function selectNode(id) {
        if (phase !== "play" && phase !== "hint") return;
        if (selected.indexOf(id) !== -1) return;
        selected.push(id);
        nodeEls[id].classList.add("selected");
        if (phase === "hint") {
          phase = "play";
          setMessage("");
        }
        drawRoute();
        syncButtons();
      }

      function launch() {
        if (phase !== "play" && phase !== "hint") return;

        var hasSansu = selected.indexOf("sansu") !== -1;
        var hasAiyu = selected.indexOf("aiyu") !== -1;
        var hasBear = selected.indexOf("bear") !== -1;
        var hasPot = selected.indexOf("pot") !== -1;

        if (!hasSansu || !hasAiyu) {
          var parts = [];
          if (!hasSansu) parts.push("還缺山蘇");
          if (!hasAiyu) parts.push("還缺愛玉");
          phase = "hint";
          setMessage(parts.join("。") + "。", "hint");
          syncButtons();
          return;
        }

        if (hasBear && hasPot) {
          phase = "fail";
          setMessage(FAIL_TEXT, "fail");
          syncButtons();
          return;
        }

        phase = "success";
        setMessage(OK_TEXT, "ok");
        syncButtons();
      }

      ORDER.forEach(function (id) {
        nodeEls[id].addEventListener("click", function () {
          selectNode(id);
        });
      });

      btnReset.addEventListener("click", function () {
        if (phase === "play" || phase === "hint") clearRouteKeepMap();
      });
      btnGo.addEventListener("click", launch);
      btnRetry.addEventListener("click", clearRouteKeepMap);
      btnAgain.addEventListener("click", clearRouteKeepMap);

      fullscreenBtn.addEventListener("click", function () {
        var root = document.documentElement;
        if (!document.fullscreenElement) {
          if (root.requestFullscreen) root.requestFullscreen();
          else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
      });

      window.addEventListener("resize", scaleStage);
      scaleStage();
      drawRoute();
      syncButtons();

      // Expose for automated verification
      window.__islandTable = {
        select: selectNode,
        launch: launch,
        reset: clearRouteKeepMap,
        getSelected: function () { return selected.slice(); },
        getPhase: function () { return phase; },
        getMessage: function () { return messageEl.textContent; },
        FAIL_TEXT: FAIL_TEXT,
        OK_TEXT: OK_TEXT
      };
    })();
  </script>
</body>
</html>
